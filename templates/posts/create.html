{% extends "base.html" %}

{% block content %}
    <form id="create-form" class="create-form">
        {% csrf_token %}

        <div class="form-group">
            <input
                type="text"
                name="title"
                class="telegraph-input"
                placeholder="Title"
                autofocus
                required
            >
        </div>

        <div class="form-group">
            <textarea
                name="content"
                class="telegraph-textarea"
                placeholder="Your story..."
                rows="12"
            ></textarea>
        </div>

        <button type="submit" class="publish-btn">
            Publish
        </button>
    </form>
{% endblock %}
