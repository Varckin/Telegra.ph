{% extends "base.html" %}
{% load locale_tags %}

{% block content %}
    <form id="create-form" class="create-form">
        {% csrf_token %}

        <div class="form-group">
            <input
                type="text"
                name="title"
                class="telegraph-input"
                placeholder="{% translate 'post.title' %}"
                autofocus
                required
            >
        </div>

        <div class="form-group">
            <textarea
                name="content"
                class="telegraph-textarea"
                placeholder="{% translate 'post.content' %}"
                rows="12"
            ></textarea>
        </div>

        <button type="submit" class="publish-btn">
            {% translate 'post.publish' %}
        </button>
    </form>
{% endblock %}
