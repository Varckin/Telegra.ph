{% extends "base.html" %}
{% load static %}
{% load locale_tags %}

{% block content %}
<div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">{% translate 'error.page_not_found' %}</h1>
    <p class="error-message">
        {% translate 'error.page_not_found_message' %}
    </p>
    <div class="back-link">
        <a href="{% url 'post_create' %}">{% translate 'error.back_home' %}</a>
    </div>
</div>
{% endblock %}
