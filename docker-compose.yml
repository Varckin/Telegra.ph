services:
  telegraph:
    build: .
    container_name: telegraph
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - xyz
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./staticcollection:/app/staticcollection
      - ./.env:/app/.env:ro
      - ./visitor_tracking/geo_lib:/app/visitor_tracking/geo_lib:ro

networks:
  xyz:
    external: true